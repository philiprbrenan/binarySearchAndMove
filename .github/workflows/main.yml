# Test 2025-04-30 at 22:20:44

name: Test
run-name: binarySearchAndMove

on:
  push:
    paths:
      - '**/main.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    permissions: write-all
    runs-on: ubuntu-latest

    strategy:
      matrix:
        task: [/home/phil/z/java/binarySearch/BinarySearch.java, /home/phil/z/java/binarySearch/Move.java, /home/phil/z/java/binarySearch/Test.java]

    steps:
    - uses: actions/checkout@v4
      with:
        ref: 'main'

    - name: 'JDK 24'
      uses: oracle-actions/setup-java@v1
      with:
        website: jdk.java.net

    - name: Java release
      run: |
        java -version

    - name: Position files in package
      run: |
        mkdir -p com/AppaApps/Silicon
        cp *.java com/AppaApps/Silicon

    - name: Java
      run: |
        javac -g -d Classes -cp Classes com/AppaApps/Silicon/*.java

    - name: Test /home/phil/z/java/binarySearch/BinarySearch.java
      if: matrix.task == '/home/phil/z/java/binarySearch/BinarySearch.java'
      run: |
        java -cp Classes com/AppaApps/Silicon//home/phil/z/java/binarySearch/BinarySearch.java


    - name: Test /home/phil/z/java/binarySearch/Move.java
      if: matrix.task == '/home/phil/z/java/binarySearch/Move.java'
      run: |
        java -cp Classes com/AppaApps/Silicon//home/phil/z/java/binarySearch/Move.java


    - name: Test /home/phil/z/java/binarySearch/Test.java
      if: matrix.task == '/home/phil/z/java/binarySearch/Test.java'
      run: |
        java -cp Classes com/AppaApps/Silicon//home/phil/z/java/binarySearch/Test.java

